<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Orbit Tutorial – AI Science Tutor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Hind:wght@400;500;600&display=swap">
<style>
:root{--btx:#fff;--bg:#f4f2ec;--card:#fff;--tx:#111;--mut:#555;--ln:#cfcac0;--c:#111;--ans:#eef6ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--btx:#111;--bg:#111;--card:#1c1c1c;--tx:#f2f2f2;--mut:#aaa;--ln:#3a3a3a;--c:#f2f2f2;--ans:#1b2a1d}}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.55 Hind,system-ui,sans-serif}
h1,h2,h3{font-family:'Baloo 2',system-ui,sans-serif;margin:0;line-height:1.2}
#app{max-width:640px;margin:0 auto;padding:16px 16px 48px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--c);outline-offset:2px}
.logo{font-family:'Baloo 2',system-ui,sans-serif;font-size:28px;display:flex;align-items:center;gap:8px}
.mut{color:var(--mut);font-size:14px}
.chips{display:flex;gap:8px;margin:10px 0 4px}
.chip{border:2px solid var(--ln);background:var(--card);border-radius:99px;padding:5px 14px}
.chip[aria-pressed=true]{background:var(--tx);color:var(--bg);border-color:var(--tx)}
h2.sec{margin:26px 0 8px;font-size:20px}
.card{background:var(--card);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 1px 0 var(--ln)}
.qn{font-weight:700;margin-bottom:4px}
.q p{margin:4px 0}
.q .pt{margin:3px 0 3px 12px}
.btn{background:var(--tx);color:var(--bg);border:0;border-radius:12px;padding:10px 16px;font-weight:600;margin-top:12px}
.btn:disabled{opacity:.5;cursor:wait}
.ghost{background:transparent;border:2px solid var(--ln);border-radius:12px;padding:6px 12px;margin-top:10px;font-size:14px}
.ans{background:var(--ans);border-radius:14px;padding:12px 14px;margin-top:12px;white-space:normal;overflow-wrap:anywhere}
.err{color:#b3261e;margin-top:10px;font-size:14px}
@media(prefers-color-scheme:dark){.err{color:#ff8a80}}
</style>
</head>
<body>
<div id="app"><p class="mut">Loading…</p></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LOGO='<svg viewBox="0 0 48 48" style="width:1.1em;height:1.1em;flex:none" role="img" aria-label="Orbit logo"><ellipse cx="24" cy="24" rx="20" ry="9" fill="none" stroke="currentColor" stroke-width="2.5" transform="rotate(-25 24 24)"/><circle cx="24" cy="24" r="8" fill="currentColor"/><circle cx="42.1" cy="15.5" r="3.5" fill="currentColor"/></svg>';
let DATA=null,LANG='en';const ANS={};   // ANS[id+'|'+lang] = {text|err|loading}

const fmt=t=>esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>');

function qHTML(q){
 const k=q.id+'|'+LANG,a=ANS[k]||{};
 return `<div class="card q"><div class="qn">Q${q.no}.</div><p>${esc(q.text)}</p>
 ${(q.parts||[]).map(p=>`<p class="pt">${esc(p)}</p>`).join('')}
 ${(q.options||[]).map(p=>`<p class="pt">${esc(p)}</p>`).join('')}
 ${a.text?`<div class="ans">${fmt(a.text)}</div><button class="ghost" data-re="${q.id}">Dobara banao</button>`
  :`<button class="btn" data-q="${q.id}" ${a.loading?'disabled':''}>${a.loading?'Soch raha hoon…':'AI Answer'}</button>`}
 ${a.err?`<div class="err" role="alert">${esc(a.err)}</div>`:''}</div>`}

function draw(){
 const d=DATA;
 $('#app').innerHTML=`<div class="logo">${LOGO}Orbit Tutorial</div>
 <div class="mut">Class ${d.class} · ${esc(d.subject)}</div>
 <h1 style="font-size:26px;margin-top:14px">Chapter ${d.chapter.no}: ${esc(d.chapter.title)}</h1>
 <div class="chips" role="group" aria-label="Answer language">
  <button class="chip" data-l="en" aria-pressed="${LANG==='en'}">English</button>
  <button class="chip" data-l="hi" aria-pressed="${LANG==='hi'}">Hinglish</button></div>
 ${d.sections.map(s=>`<h2 class="sec">${esc(s.title)}</h2>${s.questions.map(qHTML).join('')}`).join('')}
 <p class="mut" style="margin-top:28px">AI se kabhi galti ho sakti hai. Exam se pehle apni kitab se check kar lo.</p>`;
 document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{LANG=b.dataset.l;draw()});
 document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>ask(b.dataset.q,false));
 document.querySelectorAll('[data-re]').forEach(b=>b.onclick=()=>ask(b.dataset.re,true));
}

async function ask(id,fresh){
 const lang=LANG,k=id+'|'+lang,prev=ANS[k]&&ANS[k].text;
 ANS[k]={loading:true,text:fresh?null:undefined};draw();
 try{
  const r=await fetch('/api/answer',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,lang,fresh})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.error||'Answer nahi aaya. Dobara try karo.');
  ANS[k]={text:j.answer};
 }catch(e){ANS[k]={err:e.message,text:prev}}
 draw();
}

fetch('/api/questions').then(r=>r.json()).then(d=>{DATA=d;draw()})
 .catch(()=>{$('#app').innerHTML='<p class="err">Questions load nahi hue. Page refresh karo.</p>'});
</script>
</body>
</html>
