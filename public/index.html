<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Orbit Tutorial – AI Science Tutor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Hind:wght@400;500;600&display=swap">
<style>
:root{--bg:#f4f2ec;--card:#fff;--tx:#111;--mut:#6b6b6b;--ln:#cfcac0;--ans:#f1f1ee;--on:#111;--onbg:#f4f2ec;--hov:rgba(0,0,0,.07);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#111;--card:#1c1c1c;--tx:#f2f2f2;--mut:#9a9a9a;--ln:#3a3a3a;--ans:#262626;--on:#f2f2f2;--onbg:#111;--hov:rgba(255,255,255,.1)}}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.55 Hind,system-ui,sans-serif}
h1,h2,h3{font-family:'Baloo 2',system-ui,sans-serif;margin:0;line-height:1.2}
#app{max-width:640px;margin:0 auto;padding:16px 16px 48px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--tx);outline-offset:2px}
.logo{font-family:'Baloo 2',system-ui,sans-serif;font-size:28px;display:flex;align-items:center;gap:8px}
.mut{color:var(--mut);font-size:14px}
.chips{display:flex;gap:8px;margin:10px 0 4px;flex-wrap:wrap}
.chip{border:1px solid var(--ln);background:var(--card);border-radius:99px;padding:5px 14px;display:inline-flex;align-items:center;gap:6px}
.chip svg{width:16px;height:16px}
.chip[aria-pressed=true]{background:var(--on);color:var(--onbg);border-color:var(--on)}
h2.sec{margin:26px 0 8px;font-size:20px}
.card{background:var(--card);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 1px 0 var(--ln)}
.qn{font-weight:700;margin-bottom:4px}
.q p{margin:4px 0}
.q .pt{margin:3px 0 3px 12px}
.btn{background:var(--on);color:var(--onbg);border:0;border-radius:12px;padding:10px 16px;font-weight:600;margin-top:12px}
.btn:disabled{opacity:.5;cursor:wait}
.ans{background:var(--ans);border-radius:14px;padding:12px 14px;margin-top:12px;overflow-wrap:anywhere}
.saved-note{font-size:13px;color:var(--mut);margin-top:6px}
.q.can{cursor:pointer}
.qb{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;border-radius:12px}
.qbody{min-width:0;flex:1}
.chev{flex:none;width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;color:var(--mut);transition:transform .15s}
.chev svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.chev.open{transform:rotate(180deg)}
@media(prefers-reduced-motion:reduce){.chev{transition:none}}

/* ChatGPT / Claude style: borderless grey line icons */
.tb{display:flex;gap:2px;margin-top:6px;flex-wrap:wrap}
.ic{width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;border:0;background:transparent;border-radius:10px;color:var(--mut);text-decoration:none;padding:0;transition:background .12s,color .12s}
.ic:hover{background:var(--hov);color:var(--tx)}
.ic svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.ic[aria-pressed=true]{background:var(--hov);color:var(--tx)}
.ic.liked svg{fill:currentColor}
.ic:disabled{opacity:.4;cursor:not-allowed}
.ic:disabled:hover{background:transparent;color:var(--mut)}
.spin svg{animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spin svg{animation:none}}
.vis{margin-top:10px;border-radius:12px;overflow:hidden;border:1px solid var(--ln)}
.vis img{display:block;width:100%;height:auto;background:#fff}
.err{color:#b3261e;margin-top:10px;font-size:14px}
@media(prefers-color-scheme:dark){.err{color:#ff8a80}}
</style>
</head>
<body>
<div id="app"><p class="mut">Loading…</p></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LOGO='<svg viewBox="0 0 48 48" style="width:1.1em;height:1.1em;flex:none" role="img" aria-label="Orbit logo"><ellipse cx="24" cy="24" rx="20" ry="9" fill="none" stroke="currentColor" stroke-width="2.5" transform="rotate(-25 24 24)"/><circle cx="24" cy="24" r="8" fill="currentColor"/><circle cx="42.1" cy="15.5" r="3.5" fill="currentColor"/></svg>';
const ic=p=>`<svg viewBox="0 0 24 24" aria-hidden="true">${p}</svg>`;
const HEART='<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/>';
const I={
 heart:ic(HEART),
 re:ic('<path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/>'),
 tr:ic('<circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c2.5 2.5 3.5 5.5 3.5 9s-1 6.5-3.5 9c-2.5-2.5-3.5-5.5-3.5-9s1-6.5 3.5-9z"/>'),
 vis:ic('<path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/>'),
 vid:ic('<rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9l5 3-5 3z"/>'),
 say:ic('<path d="M11 5L6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/>'),
 stop:ic('<rect x="6" y="6" width="12" height="12" rx="2"/>'),
 cp:ic('<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a1 1 0 0 1 1-1h9"/>'),
 ok:ic('<path d="M5 13l4 4L19 7"/>'),
 chev:ic('<path d="M6 9l6 6 6-6"/>')
};
// translation languages: key -> button label, speech voice
const TRL={hing:{n:'Hinglish',v:'hi-IN'},as:{n:'অসমীয়া',v:'as-IN'},bn:{n:'বাংলা',v:'bn-IN'}};

let DATA=null,SHOW='all';
const ANS={};   // id -> {loading,text,err}
const TR={};    // id|lang -> {loading,text,err}
const VIS={};   // id -> {loading,svg,err}
const UI={};    // id -> {menu,tr,vis,say,copied,msg}
const ui=id=>UI[id]||(UI[id]={});

// Saved (liked) answers live in this browser, so the student can see later which answers they picked.
const SKEY='orbit_saved_v1';
let SAVED={};
try{SAVED=JSON.parse(localStorage.getItem(SKEY)||'{}')||{}}catch(e){SAVED={}}
function persist(){try{localStorage.setItem(SKEY,JSON.stringify(SAVED))}catch(e){}}
for(const id in SAVED)ANS[id]={text:SAVED[id].text};
// Every answer the AI generates is kept on this device, so it opens later even without internet.
const CKEY='orbit_answers_v1';
let CACHE={};
try{CACHE=JSON.parse(localStorage.getItem(CKEY)||'{}')||{}}catch(e){CACHE={}}
function cachePersist(){try{localStorage.setItem(CKEY,JSON.stringify(CACHE))}catch(e){}}
for(const id in SAVED)if(!CACHE[id])CACHE[id]={text:SAVED[id].text,at:SAVED[id].at};
for(const id in CACHE)if(CACHE[id]&&CACHE[id].text)ANS[id]={text:CACHE[id].text};
const OPEN={};   // id -> answer is visible (hidden by default)
const isSaved=id=>!!SAVED[id];
const nSaved=()=>Object.keys(SAVED).length;
const dateFmt=t=>new Date(t).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});

const fmt=t=>esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>');
const plain=t=>String(t||'').replace(/\*\*/g,'');
function shown(id){const u=ui(id);if(u.tr){const t=TR[id+'|'+u.tr];if(t&&t.text)return t.text}return(ANS[id]||{}).text||''}
function ytLink(q){const s=`Class 10 Science ${DATA.chapter.title} ${q.video||q.text}`.slice(0,110);return 'https://www.youtube.com/results?search_query='+encodeURIComponent(s)}

function toolbar(q){
 const id=q.id,u=ui(id),a=ANS[id]||{},tr=u.tr?TR[id+'|'+u.tr]:null,v=VIS[id]||{},sv=isSaved(id);
 return `<div class="tb" role="toolbar" aria-label="Answer tools">
  <button class="ic ${sv?'liked':''}" data-act="like" data-id="${id}" title="${sv?'Saved hai (hatane ke liye dabao)':'Is answer ko save karo'}" aria-label="${sv?'Saved answer, hatane ke liye dabao':'Answer save karo'}" aria-pressed="${sv}">${I.heart}</button>
  <button class="ic" data-act="cp" data-id="${id}" title="Copy" aria-label="Answer copy karo">${u.copied?I.ok:I.cp}</button>
  <button class="ic ${tr&&tr.loading?'spin':''}" data-act="tr" data-id="${id}" title="Translate" aria-label="Translate" aria-pressed="${!!(u.menu||u.tr)}">${I.tr}</button>
  <button class="ic ${v.loading?'spin':''}" data-act="vis" data-id="${id}" title="Diagram" aria-label="Diagram dikhao" aria-pressed="${!!u.vis}">${I.vis}</button>
  <a class="ic" href="${esc(ytLink(q))}" target="_blank" rel="noopener noreferrer" title="Video lecture (YouTube par khulega)" aria-label="Video lecture, YouTube par khulega">${I.vid}</a>
  <button class="ic" data-act="say" data-id="${id}" title="${u.say?'Rok do':'Sunao'}" aria-label="${u.say?'Rok do':'Answer sunao'}" aria-pressed="${!!u.say}">${u.say?I.stop:I.say}</button>
  <button class="ic ${a.loading?'spin':''}" data-act="re" data-id="${id}" ${sv?'disabled':''} title="${sv?'Naya answer banane ke liye pehle heart hata do':'Dobara banao (naya answer)'}" aria-label="${sv?'Dobara banao, saved answer ki wajah se band':'Dobara banao'}">${I.re}</button>
 </div>
 ${u.menu?`<div class="chips" role="group" aria-label="Translate language">
   <button class="chip" data-act="trset" data-id="${id}" data-to="" aria-pressed="${!u.tr}">English</button>
   ${Object.keys(TRL).map(k=>`<button class="chip" data-act="trset" data-id="${id}" data-to="${k}" aria-pressed="${u.tr===k}">${TRL[k].n}</button>`).join('')}</div>`:''}
 ${tr&&tr.loading?`<div class="mut" style="margin-top:8px">Anuvaad ho raha hai…</div>`:''}
 ${tr&&tr.err?`<div class="err" role="alert">${esc(tr.err)}</div>`:''}
 ${u.vis?`<div class="vis">${v.loading?'<p class="mut" style="padding:14px;margin:0">Diagram ban raha hai…</p>':v.svg?`<img alt="Diagram" src="data:image/svg+xml;charset=utf-8,${encodeURIComponent(v.svg)}">`:''}</div>`:''}
 ${u.vis&&v.err?`<div class="err" role="alert">${esc(v.err)}</div>`:''}
 ${u.msg?`<div class="mut" style="margin-top:8px" role="status">${esc(u.msg)}</div>`:''}`}

function qHTML(q){
 const a=ANS[q.id]||{},txt=shown(q.id),has=!!a.text,open=has&&!!OPEN[q.id];
 return `<div class="card q ${has?'can':''}" data-qid="${q.id}"><div class="qb" ${has?`role="button" tabindex="0" aria-expanded="${open}" aria-label="Q${q.no}. Answer ${open?'chhupao':'dikhao'}"`:''}><div class="qbody"><div class="qn">Q${q.no}.</div><p>${esc(q.text)}</p>
 ${(q.parts||[]).map(p=>`<p class="pt">${esc(p)}</p>`).join('')}
 ${(q.options||[]).map(p=>`<p class="pt">${esc(p)}</p>`).join('')}</div>${has?`<span class="chev ${open?'open':''}">${I.chev}</span>`:''}</div>
 ${has?(open?`<div class="ans">${fmt(txt)}</div>${isSaved(q.id)?`<div class="saved-note">Saved · ${dateFmt(SAVED[q.id].at)}</div>`:''}${toolbar(q)}`
  :`<div class="saved-note">Answer device mein saved hai. Dekhne ke liye question par tap karo.</div>`)
  :`<button class="btn" data-act="ask" data-id="${q.id}" ${a.loading?'disabled':''}>${a.loading?'Soch raha hoon…':'AI Answer'}</button>`}
 ${a.err?`<div class="err" role="alert">${esc(a.err)}</div>`:''}</div>`}

function draw(){
 const d=DATA,y=window.scrollY,n=nSaved();
 const secs=d.sections.map(s=>({t:s.title,qs:SHOW==='saved'?s.questions.filter(q=>isSaved(q.id)):s.questions})).filter(s=>s.qs.length);
 $('#app').innerHTML=`<div class="logo">${LOGO}Orbit Tutorial</div>
 <div class="mut">Class ${d.class} · ${esc(d.subject)}</div>
 <h1 style="font-size:26px;margin-top:14px">Chapter ${d.chapter.no}: ${esc(d.chapter.title)}</h1>
 <div class="chips" role="group" aria-label="Show">
  <button class="chip" data-show="all" aria-pressed="${SHOW==='all'}">All questions</button>
  <button class="chip" data-show="saved" aria-pressed="${SHOW==='saved'}">${ic(HEART)}Saved (${n})</button></div>
 ${secs.length?secs.map(s=>`<h2 class="sec">${esc(s.t)}</h2>${s.qs.map(qHTML).join('')}`).join('')
   :`<p class="mut" style="margin-top:24px">Abhi koi answer save nahi hua. Kisi answer ke neeche heart dabao.</p>`}
 <p class="mut" style="margin-top:28px">AI se kabhi galti ho sakti hai. Exam se pehle apni kitab se check kar lo.</p>`;
 window.scrollTo(0,y);
}

async function api(path,body){
 const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal:AbortSignal.timeout(75000)});
 const j=await r.json().catch(()=>({}));
 if(!r.ok)throw new Error(j.error||'Kuch gadbad hui. Dobara try karo.');
 return j}
const errMsg=e=>!navigator.onLine?'Internet nahi hai. Naya answer ke liye online aao. Purane answers offline dekh sakte ho.':(e.name==='TimeoutError'||e.name==='AbortError')?'Server ne jawab nahi diya. Thodi der baad dobara try karo.':(e.name==='TypeError')?'Server tak pahunch nahi paya. Internet check karke dobara try karo.':e.message;

async function ask(id,fresh){
 const prev=ANS[id]&&ANS[id].text;
 ANS[id]={loading:true,text:fresh?prev:undefined};
 if(fresh){const u=ui(id);u.tr=null;u.menu=false;u.vis=false;u.msg='';delete VIS[id];for(const t in TR)if(t.startsWith(id+'|'))delete TR[t]}
 draw();
 try{const j=await api('/api/answer',{id,fresh:!!fresh});ANS[id]={text:j.answer};CACHE[id]={text:j.answer,at:Date.now()};cachePersist();OPEN[id]=true}
 catch(e){ANS[id]={err:errMsg(e),text:prev}}
 draw();
}
function toggleOpen(id,kb){
 if(!(ANS[id]&&ANS[id].text))return;
 const u=ui(id);
 if(OPEN[id]&&u.say){speechSynthesis.cancel();u.say=false}
 OPEN[id]=!OPEN[id];draw();
 if(kb){const el=document.querySelector('.q[data-qid="'+id+'"] .qb');if(el)el.focus()}
}
function like(id){
 const u=ui(id);u.msg='';
 if(isSaved(id))delete SAVED[id];
 else if(ANS[id]&&ANS[id].text)SAVED[id]={text:ANS[id].text,at:Date.now()};
 persist();draw();
}
async function setTr(id,to){
 const u=ui(id);u.msg='';u.tr=to||null;
 const k=id+'|'+to;
 if(to&&!(TR[k]&&TR[k].text)){
  TR[k]={loading:true};draw();
  try{const j=await api('/api/translate',{id,to,text:(ANS[id]||{}).text});TR[k]={text:j.text}}
  catch(e){TR[k]={err:errMsg(e)};u.tr=null}
 }
 draw();
}
async function toggleVis(id){
 const u=ui(id);u.msg='';u.vis=!u.vis;
 if(u.vis&&!(VIS[id]&&VIS[id].svg)&&!(VIS[id]&&VIS[id].loading)){
  VIS[id]={loading:true};draw();
  try{const j=await api('/api/visual',{id,text:(ANS[id]||{}).text});VIS[id]={svg:j.svg}}
  catch(e){VIS[id]={err:errMsg(e)}}
 }
 draw();
}
function say(id){
 const u=ui(id);u.msg='';
 if(!('speechSynthesis' in window)){u.msg='Is browser mein sunne ki suvidha nahi hai.';draw();return}
 if(u.say||speechSynthesis.speaking){speechSynthesis.cancel();u.say=false;draw();return}
 const t=plain(shown(id));if(!t)return;
 const ut=new SpeechSynthesisUtterance(t);
 ut.lang=u.tr?TRL[u.tr].v:'en-IN';
 ut.onend=ut.onerror=()=>{u.say=false;draw()};
 u.say=true;speechSynthesis.speak(ut);draw();
}
async function copy(id){
 const u=ui(id);
 try{await navigator.clipboard.writeText(plain(shown(id)));u.copied=true;u.msg=''}
 catch(e){u.msg='Copy nahi ho paya. Text ko select karke copy karo.'}
 draw();setTimeout(()=>{u.copied=false;draw()},1500);
}

document.addEventListener('click',e=>{
 const s=e.target.closest('[data-show]');if(s){SHOW=s.dataset.show;draw();return}
 const b=e.target.closest('[data-act]');
 if(!b){const c=e.target.closest('.q[data-qid]');
  if(c&&!e.target.closest('.ans,.tb,.chips,.vis,.btn,a,button')&&!String(window.getSelection()))toggleOpen(c.dataset.qid);
  return}
 if(b.disabled)return;
 const id=b.dataset.id,act=b.dataset.act;
 if(act==='ask')ask(id,false);
 else if(act==='re')ask(id,true);
 else if(act==='like')like(id);
 else if(act==='tr'){const u=ui(id);u.menu=!u.menu;draw()}
 else if(act==='trset')setTr(id,b.dataset.to);
 else if(act==='vis')toggleVis(id);
 else if(act==='say')say(id);
 else if(act==='cp')copy(id);
});

document.addEventListener('keydown',e=>{
 if(e.key!=='Enter'&&e.key!==' ')return;
 const b=e.target.closest&&e.target.closest('.qb[role=button]');if(!b)return;
 e.preventDefault();toggleOpen(b.closest('.q').dataset.qid,true);
});

// Questions are cached too: the page opens at once (even offline or while Render wakes up), then refreshes quietly.
const QKEY='orbit_questions_v1';
let qOld=null;
try{qOld=localStorage.getItem(QKEY);const c=JSON.parse(qOld||'null');if(c&&c.sections){DATA=c;draw()}}catch(e){qOld=null}
fetch('/api/questions').then(r=>{if(!r.ok)throw new Error('q');return r.json()}).then(d=>{
 const nw=JSON.stringify(d);
 try{localStorage.setItem(QKEY,nw)}catch(e){}
 if(!DATA||nw!==qOld){DATA=d;draw()}
}).catch(()=>{if(!DATA)$('#app').innerHTML='<p class="err">Questions load nahi hue. Internet check karke page refresh karo.</p>'});

if('serviceWorker' in navigator)window.addEventListener('load',()=>{navigator.serviceWorker.register('/sw.js').catch(()=>{})});
</script>
</body>
</html>
