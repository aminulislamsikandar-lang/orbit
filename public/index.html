<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Orbit Tutorial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Hind:wght@400;500;600&display=swap">
<style>
:root{--btx:#fff;--bg:#f4f2ec;--card:#fff;--tx:#111;--mut:#555;--ln:#cfcac0;--c:#111;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--btx:#111;--bg:#111;--card:#1c1c1c;--tx:#f2f2f2;--mut:#aaa;--ln:#3a3a3a;--c:#f2f2f2}}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--tx);font:16px/1.55 Hind,system-ui,sans-serif}
h1,h2,h3{font-family:'Baloo 2',system-ui,sans-serif;margin:0;line-height:1.2}
#app{max-width:560px;margin:0 auto;padding:16px 16px 40px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--c);outline-offset:2px}
.logo{font-family:'Baloo 2',system-ui,sans-serif;font-size:28px;display:flex;align-items:center;gap:8px;margin:4px 0 16px}
.card{background:var(--card);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 1px 0 var(--ln)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;background:var(--card);border:2px solid var(--ln);border-radius:14px;padding:14px 16px;margin:10px 0;font-weight:600}
.row small{font-weight:400;color:var(--mut)}
.btn{background:var(--c);color:var(--btx);border:0;border-radius:12px;padding:10px 16px;font-weight:600}
.btn:disabled{opacity:.5;cursor:not-allowed}
.ghost{background:transparent;border:2px solid var(--ln);border-radius:12px;padding:8px 14px}
.back{background:none;border:0;padding:6px 0;color:var(--mut);font-weight:600}
.mut{color:var(--mut);font-size:14px}
.q{white-space:pre-line;font-weight:500}
.ans{white-space:pre-wrap;border-top:1px dashed var(--ln);margin-top:12px;padding-top:12px}
.err{color:var(--c);font-weight:600}
.langs{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 4px}
.chip{border:2px solid var(--ln);background:transparent;border-radius:999px;padding:4px 14px;font-size:14px}
.chip[aria-pressed=true]{background:var(--c);color:var(--btx);border-color:var(--c)}
.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ---- Settings -------------------------------------------------------------
// AI answers come from a server function (the AI key must never sit in this file).
// See worker/worker.js (free Cloudflare Worker).
const AI_ENDPOINT = 'https://orbit-ai.YOUR-NAME.workers.dev'; // paste your Cloudflare Worker URL here

// ---- Content: only the questions are stored; answers are made by AI on the spot ----
const DATA = [{
  id: 'sci', name: 'Science', note: 'SEBA · Class 10',
  chapters: [{
    id: 'c1', name: 'Chemical Reactions and Equations', subject: 'Class 10 Science (Chemistry), Chapter 1',
    questions: [
      {n:1, t:"Which of the statements about the reaction below are incorrect?\n2PbO(s) + C(s) → 2Pb(s) + CO₂(g)\n(a) Lead is getting reduced.\n(b) Carbon dioxide is getting oxidised.\n(c) Carbon is getting oxidised.\n(d) Lead oxide is getting reduced.\n(i) (a) and (b)\n(ii) (a) and (c)\n(iii) (a), (b) and (c)\n(iv) all"},
      {n:2, t:"Fe₂O₃ + 2Al → Al₂O₃ + 2Fe\nThe above reaction is an example of a\n(a) combination reaction.\n(b) double displacement reaction.\n(c) decomposition reaction.\n(d) displacement reaction."},
      {n:3, t:"What happens when dilute hydrochloric acid is added to iron fillings? Tick the correct answer.\n(a) Hydrogen gas and iron chloride are produced.\n(b) Chlorine gas and iron hydroxide are produced.\n(c) No reaction takes place.\n(d) Iron salt and water are produced."},
      {n:4, t:"What is a balanced chemical equation? Why should chemical equations be balanced?"},
      {n:5, t:"Translate the following statements into chemical equations and then balance them.\n(a) Hydrogen gas combines with nitrogen to form ammonia.\n(b) Hydrogen sulphide gas burns in air to give water and sulphur dioxide.\n(c) Barium chloride reacts with aluminium sulphate to give aluminium chloride and a precipitate of barium sulphate.\n(d) Potassium metal reacts with water to give potassium hydroxide and hydrogen gas."},
      {n:6, t:"Balance the following chemical equations.\n(a) HNO₃ + Ca(OH)₂ → Ca(NO₃)₂ + H₂O\n(b) NaOH + H₂SO₄ → Na₂SO₄ + H₂O\n(c) NaCl + AgNO₃ → AgCl + NaNO₃\n(d) BaCl₂ + H₂SO₄ → BaSO₄ + HCl"},
      {n:7, t:"Write the balanced chemical equations for the following reactions.\n(a) Calcium hydroxide + Carbon dioxide → Calcium carbonate + Water\n(b) Zinc + Silver nitrate → Zinc nitrate + Silver\n(c) Aluminium + Copper chloride → Aluminium chloride + Copper\n(d) Barium chloride + Potassium sulphate → Barium sulphate + Potassium chloride"}
    ]
  }]
}];
const LANGS = [['en','English'],['hi','हिन्दी'],['as','অসমীয়া'],['bn','বাংলা']];

// ---- Helpers --------------------------------------------------------------
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LOGO = '<svg viewBox="0 0 48 48" style="width:1.1em;height:1.1em;flex:none" role="img" aria-label="Orbit Tutorial logo"><ellipse cx="24" cy="24" rx="20" ry="9" fill="none" stroke="currentColor" stroke-width="2.5" transform="rotate(-25 24 24)"/><circle cx="24" cy="24" r="8" fill="currentColor"/><circle cx="42.1" cy="15.5" r="3.5" fill="currentColor"/></svg>';
const store = { get(k, d){ try { return localStorage.getItem(k) || d } catch(e){ return d } }, set(k, v){ try { localStorage.setItem(k, v) } catch(e){} } };

let lang = store.get('orbit_lang', 'en');
let view = { s: null, c: null };           // current subject / chapter ids
const ANS = {};                            // answers kept in memory: key -> {text, err, loading}
const key = (c, n) => c + ':' + n + ':' + lang;

// ---- AI call --------------------------------------------------------------
async function askAI(ch, q, another) {
  const k = key(ch.id, q.n);
  ANS[k] = { loading: true };
  draw();
  try {
    const r = await fetch(AI_ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ chapter: ch.subject + ' — ' + ch.name, question: q.t, lang, another: !!another, previous: another && ANS[k] ? ANS[k].text : '' })
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || !j.answer) throw new Error(j.error || 'AI se jawab nahi mila.');
    ANS[k] = { text: j.answer };
  } catch (e) {
    ANS[k] = { err: 'Jawab nahi aaya. Internet check karke dobara try karo.' };
  }
  draw();
}

// ---- Screens --------------------------------------------------------------
function header(title, backTo) {
  return `<div class="logo">${LOGO}Orbit Tutorial</div>` +
    (backTo ? `<button class="back" data-go="${backTo}">← Peeche</button>` : '') +
    (title ? `<h2 style="margin:4px 0 8px">${esc(title)}</h2>` : '');
}

function draw() {
  const a = $('#app');
  const sub = DATA.find(s => s.id === view.s);
  const ch = sub && sub.chapters.find(c => c.id === view.c);

  if (!sub) {                                   // 1. subjects
    a.innerHTML = header('Subject chuno') +
      DATA.map(s => `<button class="row" data-sub="${s.id}"><span>${esc(s.name)}<br><small>${esc(s.note)}</small></span><span>→</span></button>`).join('');
  } else if (!ch) {                             // 2. chapters
    a.innerHTML = header(sub.name, 'home') +
      sub.chapters.map((c, i) => `<button class="row" data-ch="${c.id}"><span>${i + 1}. ${esc(c.name)}<br><small>${c.questions.length} exercise questions</small></span><span>→</span></button>`).join('');
  } else {                                      // 3. exercise questions with AI answers
    a.innerHTML = header(ch.name, 'sub') +
      `<div class="mut">Answer ki bhasha</div>
       <div class="langs">${LANGS.map(([c, n]) => `<button class="chip" data-lang="${c}" aria-pressed="${c === lang}">${n}</button>`).join('')}</div>
       <h3 style="margin:16px 0 4px">Exercises</h3>` +
      ch.questions.map(q => {
        const A = ANS[key(ch.id, q.n)];
        let body = '';
        if (A && A.loading) body = `<div class="ans mut" aria-live="polite">AI jawab bana raha hai…</div>`;
        else if (A && A.err) body = `<div class="ans err" role="alert">${esc(A.err)}</div>`;
        else if (A && A.text) body = `<div class="ans">${esc(A.text)}</div>`;
        const busy = A && A.loading;
        return `<div class="card"><div class="q"><b>${q.n}.</b> ${esc(q.t)}</div>${body}
          <div class="actions">
            <button class="btn" data-ask="${q.n}" ${busy ? 'disabled' : ''}>${A && A.text ? 'Dobara jawab' : 'AI se jawab lo'}</button>
            ${A && A.text ? `<button class="ghost" data-other="${q.n}" ${busy ? 'disabled' : ''}>Dusra tareeka</button>` : ''}
          </div></div>`;
      }).join('');
  }
}

// ---- Events (one listener, no inline handlers) ----------------------------
document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  const sub = DATA.find(s => s.id === view.s);
  const ch = sub && sub.chapters.find(c => c.id === view.c);
  if (t.dataset.sub) { view = { s: t.dataset.sub, c: null }; draw(); scrollTo(0, 0); }
  else if (t.dataset.ch) { view.c = t.dataset.ch; draw(); scrollTo(0, 0); }
  else if (t.dataset.go) { view = t.dataset.go === 'home' ? { s: null, c: null } : { s: view.s, c: null }; draw(); scrollTo(0, 0); }
  else if (t.dataset.lang) { lang = t.dataset.lang; store.set('orbit_lang', lang); draw(); }
  else if (t.dataset.ask && ch) askAI(ch, ch.questions.find(q => q.n == t.dataset.ask), false);
  else if (t.dataset.other && ch) askAI(ch, ch.questions.find(q => q.n == t.dataset.other), true);
});

draw();
</script>
</body>
</html>
